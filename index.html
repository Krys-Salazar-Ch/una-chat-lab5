<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Chat Socket.IO UNA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font: 13px Helvetica, Arial; }
      form { background: #000; padding: 3px; position: fixed; bottom: 0; width: 100%; }
      form input { border: 0; padding: 10px;}
      form button { width: 10%; background: rgb(130, 224, 255);  border: none; padding: 10px; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages li { padding: 5px 10px; }
      #messages li:nth-child(odd) { background: #eee; }
      #messages { margin-bottom: 40px }
      #messages img, #messages video, #messages iframe { display: block; margin-top: 4px; }
      #nombre, #m { display: inline-block;}
      #m {width: 69%; margin-right: 4px;}
      #nombre {width: 20%}
      #sesion { display: none; position: sticky; top: 0; z-index: 1; background: #00205b; color: #fff; padding: 8px 10px; align-items: center; gap: 12px; }
      #sesion.activa { display: flex; }
      #sesion #usuario { font-weight: bold; flex: 1; }
      #sesion a { color: #fff; background: #c8102e; padding: 6px 12px; border-radius: 4px; text-decoration: none; }
    </style>
  </head>
  <body>
    <header id="sesion" aria-label="Sesión">
      <span>UNA Chat · Sala</span>
      <span id="usuario"></span>
      <a id="cerrar-sesion" href="/auth/logout">Cerrar sesión</a>
    </header>
    <ul id="messages" aria-label="Mensajes"></ul>
    <form action="">
      <input id="nombre" autocomplete="off" placeholder="Username" aria-label="Usuario"/>
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" aria-label="Mensaje" /><button type="submit">Send</button>
    </form>
    <!-- cliente servido por el propio backend: misma versión que el servidor -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/vendor/jquery/jquery.min.js"></script>
    <script>

    var colorHexTxt = "";

    // genera colores aleatorios en hexadecimal
    function getRandomColor() {
        var letters = '0123456789ABCDEF';
        var color = '#';
        for (var i = 0; i < 6; i++) {
          color += letters[Math.floor(Math.random() * 16)];
        }
        return color;
     }

      // Con login activo (Auth0), muestra el usuario y usa su nombre en los mensajes.
      function cargarSesion() {
        return fetch('/auth/me', { credentials: 'same-origin', headers: { accept: 'application/json' } })
          .then(function (r) {
            if (r.status === 401) { window.location.href = '/auth/login'; return null; }
            return r.json();
          })
          .catch(function () { return { enabled: false }; });
      }

      $(function () {
       cargarSesion().then(function (sesion) {
        if (sesion === null) return;
        if (sesion.enabled && sesion.user) {
          $('#usuario').text(sesion.user.name);
          $('#sesion').addClass('activa');
          $('#nombre').val(sesion.user.name).prop('readonly', true);
        }

        var socket = io();

        socket.on('connect_error', function (err) {
          if (err && err.message === 'No autorizado') window.location.href = '/auth/login';
        });

        // emite evento al servidor
        $('form').submit(function(){
            var nombreTxt = $('#nombre').val() || "Anónimo";
            var mensajeTxt = $('#m').val();

            if (colorHexTxt == "") {
                colorHexTxt = getRandomColor();
            }

            var jsonMsg = { nombre: nombreTxt, mensaje: mensajeTxt, color: colorHexTxt };
            socket.emit('Evento-Mensaje-Server', JSON.stringify(jsonMsg));
            $('#m').val('');
            return false;
        });

        // recibe el mensaje YA validado y saneado por una-lib en el servidor
        socket.on('Evento-Mensaje-Server', function(msg){
            var msgJson = JSON.parse(msg);
            var color = /^#[0-9a-f]{6}$/i.test(msgJson.color) ? msgJson.color : '#000000';

            var li = $('<li>').attr('data-tipo', msgJson.tipo || 'texto');
            // nombre ya viene escapado por el servidor
            $('<b>').css('color', color).html(msgJson.nombre).appendTo(li);
            li.append(document.createTextNode(': '));

            // el mensaje es HTML generado por una-lib (texto escapado o <img>/<video>/<iframe> controlados).
            // Se parsea sin ejecutar scripts y se descarta cualquier <script> por defensa en profundidad.
            var nodos = $.parseHTML(msgJson.mensaje, document, false) || [];
            li.append(nodos);

            $('#messages').append(li);
            window.scrollTo(0, document.body.scrollHeight);
        });

        // error al procesar el mensaje propio (por ejemplo, el fallo controlado)
        socket.on('Evento-Error-Server', function(texto){
            $('<li>').attr('data-tipo', 'error').css('color', '#b00020').text('⚠ ' + texto).appendTo('#messages');
            window.scrollTo(0, document.body.scrollHeight);
        });

       });
      });
    </script>
  </body>
</html>
